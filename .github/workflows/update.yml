name: Update Macro Dashboard

on:
  schedule:
    - cron: '0 11 * * 1-5' # 11:00 UTC, Mon-Fri
  workflow_dispatch: # Allow manual run

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dashboard Update
        run: |
          python dashboard/build_dashboard.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Add all relevant artifacts including history and docs
          git add data/history/ charts/ reports/ docs/
          git commit -m "Auto-update macro dashboard: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
